[server]
# Stops Streamlit from watching every file in every installed package
# (transformers alone has hundreds of submodules) for hot-reload.
# This was the direct cause of the multi-minute startup lag: on every
# import of sentence-transformers, Streamlit tried to inspect every
# transformers image-processor submodule, most of which fail because
# torchvision isn't installed - each failure is caught and harmless,
# but there are hundreds of them, every single run.
fileWatcherType = "none"
